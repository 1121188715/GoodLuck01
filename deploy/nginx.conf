# GoodLuck 飞行棋 - Nginx 配置
# 使用方法：sudo cp deploy/nginx.conf /etc/nginx/sites-available/goodluck
#          sudo ln -sf /etc/nginx/sites-available/goodluck /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# 说明：
# - 80 端口：将所有请求重定向到 HTTPS
# - 443 端口：使用 Let’s Encrypt 证书提供 HTTPS 服务
# - 若项目路径不是 /var/www/GoodLuck，请同时修改 root 路径

# HTTP：跳转到 HTTPS
server {
    listen 80 default_server;
    server_name goodlucksp.top www.goodlucksp.top;

    return 301 https://$host$request_uri;
}

# HTTPS：实际服务
server {
    listen 443 ssl http2 default_server;
    server_name goodlucksp.top www.goodlucksp.top;

    root /var/www/GoodLuck/frontend;
    index index.html;

    # Let’s Encrypt 签发的证书路径
    ssl_certificate     /etc/letsencrypt/live/goodlucksp.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goodlucksp.top/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 前端静态文件
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 代理
    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 文档
    location /docs {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

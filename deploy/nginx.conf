# GoodLuck 飞行棋 - Nginx 配置
# 使用方法：sudo cp deploy/nginx.conf /etc/nginx/sites-available/goodluck
#          sudo ln -sf /etc/nginx/sites-available/goodluck /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# 将 YOUR_DOMAIN_OR_IP 替换为你的域名或公网 IP

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;
    root /var/www/GoodLuck/frontend;
    index index.html;

    # 前端静态文件
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 代理
    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 文档
    location /docs {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
